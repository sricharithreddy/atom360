<!-- lead-summary: Overview tab. What the caller needs at a glance, nothing to read through. -->
<div class="m-sum">
<sc-if value="{{ m.sum.banner.show }}">
<div class="m-banner {{ m.sum.banner.cls }}" role="note">
<sc-if value="{{ m.sum.banner.stop }}"><svg class="m-fixed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg></sc-if>
<sc-if value="{{ m.sum.banner.stop }}" not><svg class="m-fixed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
<div class="m-grow"><strong class="m-sum-banner-title">{{ m.sum.banner.title }}</strong><span class="m-sum-banner-text">{{ m.sum.banner.text }}</span></div>
</div>
</sc-if>

<section class="m-card m-sum-head" aria-label="Why call now">
<p class="m-sum-why" style="color: {{ m.sum.whyFg }}">{{ m.sum.why }}</p>
<sc-if value="{{ m.sum.hasNext }}"><p class="m-sum-next"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{ m.sum.next }}</p></sc-if>
<sc-if value="{{ m.sum.hasChips }}"><div class="m-sum-chips"><sc-for list="{{ m.sum.chips }}" as="kc"><span class="m-tag -wrap {{ kc.cls }}">{{ kc.t }}</span></sc-for></div></sc-if>
<sc-if value="{{ m.sum.hasMerge }}"><button type="button" class="m-btn -sm -soft m-sum-merge" onClick="{{ m.sum.merge.act }}">{{ m.sum.merge.label }}</button></sc-if>
</section>

<sc-for list="{{ m.sum.strips }}" as="strip">
<section class="m-card m-sum-strip {{ strip.cls }}" aria-label="{{ strip.title }}">
<div class="m-inline -between"><h2 class="m-sum-eyebrow m-sum-strip-title">{{ strip.title }}</h2></div>
<p class="m-sum-strip-head">{{ strip.head }}</p>
<ol class="m-sum-steps" aria-label="Steps">
<sc-for list="{{ strip.steps }}" as="step"><li class="m-sum-step {{ step.cls }}" aria-current="{{ step.cur }}"><span class="m-sum-step-n" aria-hidden="true">{{ step.n }}</span><span class="m-sum-step-l">{{ step.label }}<span class="m-sr">, {{ step.state }}</span></span></li></sc-for>
</ol>
<sc-for list="{{ strip.acts }}" as="act2"><button type="button" class="m-btn -block m-sum-act {{ act2.cls }}" onClick="{{ act2.pick }}">{{ act2.label }}</button></sc-for>
<sc-if value="{{ strip.demoShow }}">
<div class="m-sum-demo"><span class="m-sum-demo-label">Demo</span><button type="button" class="m-btn -sm m-grow" onClick="{{ strip.demo }}">{{ strip.demoLabel }}</button></div>
</sc-if>
</section>
</sc-for>

<dl class="m-sum-facts" aria-label="Key facts">
<sc-for list="{{ m.sum.facts }}" as="kf"><div class="m-sum-fact"><dt>{{ kf.k }}</dt><dd style="color: {{ kf.fg }}">{{ kf.v }}</dd></div></sc-for>
</dl>

<button type="button" class="m-card m-sum-row" onClick="{{ m.toQuotes }}">
<span class="m-sum-ico -tag" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path><circle cx="8" cy="8" r="1.4"></circle></svg></span>
<span class="m-grow m-sum-row-main"><span class="m-sum-row-k">{{ m.sum.quotes.title }}</span><span class="m-sum-row-v">{{ m.sum.quotes.sub }}</span></span>
<svg class="m-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>

<button type="button" class="m-card m-sum-row" onClick="{{ m.toHist }}">
<span class="m-sum-ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg></span>
<span class="m-grow m-sum-row-main"><span class="m-sum-row-k">Last contact</span><sc-if value="{{ m.sum.hasLast }}"><span class="m-sum-row-v">{{ m.sum.lastT }}</span><span class="m-tiny">{{ m.sum.lastWhen }}</span></sc-if><sc-if value="{{ m.sum.hasLast }}" not><span class="m-sum-row-v">No calls yet</span></sc-if></span>
<svg class="m-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>

<sc-if value="{{ m.sum.hasReassign }}">
<div class="m-card m-field m-sum-reassign"><label for="msumOwner">Owner</label><select id="msumOwner" class="m-select" onChange="{{ m.sum.reassign.onSel }}"><sc-for list="{{ m.sum.reassign.opts }}" as="opt"><option value="{{ opt.val }}" selected="{{ opt.on }}">{{ opt.label }}</option></sc-for></select></div>
</sc-if>
</div>
