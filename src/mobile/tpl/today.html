<!-- Today: day summary, callback alert, tabs, filters, then the queue of lead cards. -->

<section class="m-today-dash" aria-label="{{ m.today.scope }}">
<div class="m-today-kpi"><span class="m-today-kpi-v m-num">{{ hs.calls }}<small>/{{ hs.callsT }}</small></span><span class="m-today-kpi-k">Calls</span><span class="m-today-bar" aria-hidden="true"><span style="width: {{ m.today.callsW }}"></span></span></div>
<div class="m-today-kpi"><span class="m-today-kpi-v m-num">{{ hs.conn }}</span><span class="m-today-kpi-k">Connected</span></div>
<div class="m-today-kpi"><span class="m-today-kpi-v m-num m-today-good">{{ hs.ren }}</span><span class="m-today-kpi-k">Renewed</span></div>
<div class="m-today-kpi"><span class="m-today-kpi-v m-num">{{ hs.mon }}<small>/{{ hs.monT }}</small></span><span class="m-today-kpi-k">This month</span><span class="m-today-bar -grad" aria-hidden="true"><span style="width: {{ hs.monW }}"></span></span></div>
</section>

<div class="m-seg -scroll m-today-tabs" role="tablist" aria-label="Quick views">
<sc-for list="{{ m.today.tabs }}" as="tb"><button type="button" role="tab" aria-selected="{{ tb.selected }}" onClick="{{ tb.pick }}">{{ tb.label }}<sc-if value="{{ tb.showCount }}"> <span class="m-count {{ tb.countCls }}">{{ tb.count }}</span></sc-if></button></sc-for>
</div>

<sc-if value="{{ m.today.hasPills }}">
<div class="m-scroller m-today-filters" role="group" aria-label="Active filters">

<sc-for list="{{ m.today.stageChips }}" as="schip"><button type="button" class="m-chip -on m-today-chip" aria-label="Remove filter {{ schip.label }}" onClick="{{ schip.remove }}">{{ schip.label }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-for><sc-for list="{{ chips }}" as="chip"><button type="button" class="m-chip -on m-today-chip" aria-label="Remove filter {{ chip.label }}" onClick="{{ chip.remove }}">{{ chip.label }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-for>
</div>
</sc-if>

<sc-if value="{{ m.today.filtered }}">
<div class="m-today-shown"><p class="m-small" role="status">Showing <strong class="m-strong">{{ m.today.shown }}</strong> of {{ totalCount }}</p><button type="button" class="m-link" onClick="{{ m.today.clearAll }}">Clear all</button></div>
</sc-if>

<sc-for list="{{ m.today.groups }}" as="grp">
<section class="m-today-grp" aria-label="{{ grp.title }}">
<div class="m-today-grp-head">
<div class="m-inline -between"><h2 class="m-h2" style="color: {{ grp.fg }}">{{ grp.title }}</h2><span class="m-small m-fixed">{{ grp.count }}</span></div>
</div>
<ul class="m-stack">
<sc-for list="{{ grp.cards }}" as="card">
<li class="m-card -nopad m-today-card m-mood {{ card.moodCls }}">
<button type="button" class="m-today-main" onClick="{{ card.open }}">
<span class="m-today-top"><span class="m-today-name m-clip">{{ card.name }}<span class="m-sr">, {{ card.moodSay }}</span></span><span class="m-today-prio" role="img" aria-label="{{ card.prioLabel }}"><sc-for list="{{ card.stars }}" as="sr"><svg class="m-today-pstar {{ sr.cls }}" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"></path></svg></sc-for></span></span>
<span class="m-today-meta"><span class="m-today-ptype {{ card.rtypeCls }}"><span class="m-sr">Renewal type </span>{{ card.rtypeText }}</span><sc-if value="{{ card.hasLeadType }}"><span class="m-today-ltype m-clip">{{ card.leadType }}</span></sc-if></span>
<span class="m-today-cover"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span class="m-today-cover-t"><sc-if value="{{ card.coverKnown }}"><span class="m-sr">Previous policy cover </span></sc-if>{{ card.cover }}</span></span>
<sc-if value="{{ card.hasMeta }}"><span class="m-today-tags"><sc-for list="{{ card.tags }}" as="tag"><span class="m-tag {{ tag.cls }}"><sc-if value="{{ tag.ai }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"></path></svg></sc-if>{{ tag.text }}</span></sc-for></span></sc-if>
<sc-if value="{{ card.hasSummary }}"><span class="m-today-sum {{ card.pulseCls }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"></path></svg><span class="m-clip2"><sc-if value="{{ card.boxTime }}"><strong class="m-today-sum-time">{{ card.boxTime }}</strong> · </sc-if>{{ card.summary }}<sc-if value="{{ card.late }}"> · <strong class="m-today-sum-late">{{ card.late }}</strong></sc-if></span></span></sc-if>
<sc-if value="{{ card.hasQuote }}"><span class="m-today-quote"><span class="m-fixed">Best quote</span><span class="m-today-quote-v"><span class="m-clip">{{ card.quoteIns }}</span><strong class="m-fixed">{{ card.quoteAmt }}</strong></span></span></sc-if>
<sc-if value="{{ card.hasQuote }}" not><span class="m-today-quote"><span>No quotes yet</span></span></sc-if>
</button>
<div class="m-today-veh">
<button type="button" class="m-today-veh-head" aria-expanded="{{ card.vehOpenStr }}" aria-label="Vehicle {{ card.model }}, {{ card.reg }}. Show chassis and engine numbers" onClick="{{ card.toggleVeh }}"><svg class="m-today-veh-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14M6 17l1.5-5.5A2 2 0 0 1 9.4 10h5.2a2 2 0 0 1 1.9 1.5L18 17"></path><path d="M4 17v2M20 17v2"></path></svg><span class="m-today-veh-v">{{ card.model }} · <span class="m-today-veh-reg">{{ card.reg }}</span></span><svg class="m-today-veh-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{ card.vehOpen }}">
<div class="m-today-veh-body"><sc-for list="{{ card.vrows }}" as="vn"><div class="m-today-vrow"><span class="m-today-vk">{{ vn.k }}</span><span class="m-today-vv">{{ vn.v }}</span><button type="button" class="m-today-vcopy" aria-label="{{ vn.label }}" onClick="{{ vn.copy }}"><sc-if value="{{ vn.copied }}" not><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg></sc-if><sc-if value="{{ vn.copied }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></sc-if></button></div></sc-for></div>
</sc-if>
</div>
<div class="m-today-acts">
<button type="button" class="m-btn -grow {{ card.callCls }}" aria-label="{{ card.callAria }}" onClick="{{ card.call }}"><sc-if value="{{ card.ready }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z"></path></svg></sc-if><sc-if value="{{ card.live }}"><span class="m-live-dot" aria-hidden="true"></span></sc-if><sc-if value="{{ card.blocked }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg></sc-if><span class="m-clip">{{ card.callText }}</span></button>
<button type="button" class="m-iconbtn -line m-today-wa" aria-label="WhatsApp {{ card.name }}" onClick="{{ card.wa }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z"></path></svg></button>
</div>
</li>
</sc-for>
</ul>
</section>
</sc-for>

<sc-if value="{{ m.today.empty }}">
<div class="m-empty m-today-empty">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h4l1.5 3h5L16 13h4"></path><path d="M6 5h12l2 8v6H4v-6z"></path></svg>
<h2 class="m-h3">{{ m.today.emptyTitle }}</h2>
<p>{{ m.today.emptyBody }}</p>
<sc-if value="{{ m.today.emptyClear }}"><button type="button" class="m-btn -primary" onClick="{{ m.today.clearAll }}">Clear filters</button></sc-if>
<sc-if value="{{ m.today.emptyAll }}"><button type="button" class="m-btn" onClick="{{ m.today.showAll }}">Show all leads</button></sc-if>
</div>
</sc-if>

<button type="button" class="m-fab" aria-label="Add a policy: scan or type it in" onClick="{{ m.add.start }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
